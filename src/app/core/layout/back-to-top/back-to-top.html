<button
  (click)="scrollToTop()"
  class="fixed bottom-6 right-6 z-50 p-3 bg-gradient-to-tr from-indigo-400 to-indigo-700 text-white rounded-full shadow-xl transition-all duration-400 ease-in-out cursor-pointer hover:scale-110 focus:outline-none"
  [class.opacity-0]="!showButton()"
  [class.translate-y-12]="!showButton()"
  [class.pointer-events-none]="!showButton()"
  [class.opacity-100]="showButton()"
  [class.translate-y-0]="showButton()"
  aria-label="Scroll to top"
  title="Back to Top"
>
  <svg
    class="w-5 h-5 relative z-10"
    xmlns="http://www.w3.org/2000/svg"
    fill="none"
    viewBox="0 0 24 24"
    stroke-width="2.5"
    stroke="currentColor"
  >
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      d="M4.5 10.5 12 3m0 0 7.5 7.5M12 3v18"
    />
  </svg>
</button>
