<!-- Main Content -->
<section class="py-10 px-4">
  <div
    class="rounded-2xl relative flex flex-col max-w-screen-xl mx-auto bg-secondary p-6"
  >
    <!-- Title and Uploader -->
    <h1 class="font-bold mb-2 md:text-3xl text-xl">{{ clip()?.title }}</h1>
    <div class="text-gray-400 mb-6 md:text-lg text-sm">
      Uploaded By {{ clip()?.displayName }}
      <span class="block">
        {{
          clip()?.timestamp!.toDate() | date: "dd MMM yyyy 'at' hh:mm:ss a"
        }}</span
      >
    </div>

    <div class="relative">
      <div class="aspect-video w-full mx-auto">
        <video
          #videoPlayer
          class="video-js vjs-theme-forest vjs-fill vjs-fluid"
          crossorigin="anonymous"
          controls
          preload="auto"
        ></video>
      </div>
    </div>
  </div>
</section>

<!-- More Clips -->
<section class="container mx-auto mb-20 px-4">
  <h2 class="mb-8 text-3xl">More Clips</h2>

  <app-clip-list [batchSize]="3" [showLoadMore]="false"></app-clip-list>
</section>
