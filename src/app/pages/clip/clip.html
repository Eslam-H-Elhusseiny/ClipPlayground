<!-- Main Content -->
<section class="container mx-auto mt-10 mb-16 bg-secondary p-6">
  <div class="rounded relative flex flex-col">
    <!-- Title and Uploader -->
    <h1 class="font-bold mb-2 text-3xl">{{ id() }}</h1>
    <div class="text-gray-400 mb-6">
      Uploaded By Luis on
      <span>March 25, 2025</span>
    </div>

    <!-- Video Editor -->
    <div class="relative">
      <!-- Video Player -->
      <video
        controls
        class="video-js vjs-theme-forest mx-auto aspect-video w-full h-80"
        data-setup="{}"
      >
        <source src="assets/video/hero.webm" type="video/webm" />
      </video>
    </div>
  </div>
</section>

<!-- More Clips -->
<section class="container mx-auto mb-20">
  <h2 class="mb-8 text-3xl">More Clips</h2>

  <app-clip-list [batchSize]="3" [showLoadMore]="false"></app-clip-list>
</section>
