<!-- Edit Modal -->
<app-modal modalId="editClip">
  <p class="text-2xl font-bold" heading>Edit Video</p>

  @if (alert.getAlert().showAlert) {
    <app-alert [color]="alert.getAlert().alertColor" class="text-center">
      {{ alert.getAlert().alertMessage }}
    </app-alert>
  }

  <!-- Form -->
  <form [formGroup]="editClipForm" (ngSubmit)="editClip()">
    <!-- Title -->
    <div class="mt-4">
      <label class="block text-xl mb-4">Title</label>
      <app-input-field
        [control]="editClipForm.controls.title"
        placeholder="Enter a new title"
      ></app-input-field>
    </div>

    <div class="flex justify-between mt-6 text-white">
      <button
        type="button"
        class="bg-red-500 py-2 px-4 rounded-md cursor-pointer hover:bg-red-600 transition disabled:opacity-50"
        [disabled]="inSubmission()"
        (click)="deleteClip()"
      >
        Delete
      </button>
      <button
        type="submit"
        class="py-2 px-4 border border-transparent shadow-sm rounded-md cursor-pointer bg-indigo-600 focus:outline-none"
        [class]="
          !editClipForm.valid || inSubmission() || editClipForm.pristine
            ? 'opacity-50'
            : 'hover:bg-indigo-700'
        "
        [disabled]="
          !editClipForm.valid || inSubmission() || editClipForm.pristine
        "
      >
        Save Changes
      </button>
    </div>
  </form>
</app-modal>
