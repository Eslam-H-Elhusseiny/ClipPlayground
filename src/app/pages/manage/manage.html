<!-- Top Bar -->
<section class="container mx-auto my-8 bg-secondary p-6">
  <div class="rounded relative flex justify-between">
    <a routerLink="/upload" class="bg-indigo-400 text-white py-4 px-10 text-xl"
      >Upload Videos</a
    >

    <!-- Sort Videos -->
    <select
      class="bg-slate-500 px-8 text-xl underline outline-none appearance-none"
      (change)="sortClips($event)"
    >
      <option value="1" [selected]="sortOrder() === '1'">
        Recent Uploads &udarr;
      </option>
      <option value="2" [selected]="sortOrder() === '2'">
        Oldest Uploads &udarr;
      </option>
    </select>
  </div>
</section>

<!-- User's Video Section -->
<div class="container mx-auto my-8">
  <!-- Video List -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
    @for (clip of orderedClips(); track clip.docID) {
      <div
        class="mt-6 rounded-tl-2xl rounded-br-2xl shadow-xl bg-secondary flex flex-col justify-start"
      >
        <!-- Image -->
        <a href="#">
          <img
            class="card-img-top rounded-tl-2xl w-full"
            src="assets/img/1.jpg"
          />
        </a>

        <!-- Body -->
        <div class="px-5 py-4 text-2xl">
          <!-- Link -->
          <a href="#" class="inline-block font-bold mb-4">
            {{ clip.title }}
          </a>
          <p class="text-sm text-right">
            {{ clip.timestamp.toDate() | date: "dd MMM yyyy 'at' hh:mm:s a" }}
          </p>
        </div>

        <!-- Actions -->
        <div
          class="text-center text-2xl m-4 mt-0 bg-gray-800 transition hover:bg-indigo-400 rounded-2xl"
        >
          <a
            (click)="openModal($event, clip)"
            href="#"
            class="inline-block p-4 w-full"
          >
            <span class="inline-block">🛠️</span>
            Edit
          </a>
        </div>
      </div>
    }
  </div>
</div>

<app-edit
  [activeClip]="activeClip()"
  (updatedClipData)="updateClip($event)"
  (deletedClipData)="deleteClip($event)"
></app-edit>
