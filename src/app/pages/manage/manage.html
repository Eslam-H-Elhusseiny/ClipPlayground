<section class="py-10 px-4 min-h-[83vh]">
  <!-- Top Bar -->
  <div
    class="container mx-auto bg-secondary mb-12 p-6 rounded-2xl flex justify-between"
  >
    <a
      routerLink="/upload"
      class="bg-indigo-400 text-white py-3 px-10 text-base rounded-full hover:bg-indigo-500 transition max-sm:hidden"
      >Upload Videos</a
    >
    <a
      routerLink="/upload"
      class="bg-indigo-400 text-white py-3 px-4 text-base rounded-full hover:bg-indigo-500 transition min-sm:hidden"
      ><svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="w-6 h-6"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 16V4m0 0l-4 4m4-4l4 4"
        />
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M20 16.5V18a2.25 2.25 0 01-2.25 2.25H6.25A2.25 2.25 0 014 18v-1.5"
        />
      </svg>
    </a>

    <!-- Sort Videos -->
    <select
      class="bg-slate-600 py-3 px-8 text-base underline outline-none appearance-none rounded-full cursor-pointer hover:bg-slate-500 focus:bg-slate-500 transition"
      (change)="sortClips($event)"
    >
      <option value="1" [selected]="sortOrder() === '1'">
        Recent Uploads &udarr;
      </option>
      <option value="2" [selected]="sortOrder() === '2'">
        Oldest Uploads &udarr;
      </option>
    </select>
  </div>

  <!-- User's Video Section -->
  <div class="container mx-auto">
    <!-- Video List -->
    @defer (on timer(500)) {
      <div class="grid gap-10 grid-cols-1 md:grid-cols-2 xl:grid-cols-3 px-4">
        @for (clip of orderedClips(); track clip.docID) {
          <app-clip-card [clip]="clip">
            <div
              class="text-center text-xl max-sm:text-base m-4 mt-0 bg-gray-800 transition hover:bg-indigo-400 rounded-2xl"
            >
              <a
                (click)="openModal($event, clip)"
                href="#"
                class="inline-block p-3 w-full"
              >
                <span class="inline-block">🛠️</span>
                Edit
              </a>
            </div>
          </app-clip-card>
        }
      </div>
    } @placeholder {
      <div class="grid gap-10 grid-cols-1 md:grid-cols-2 xl:grid-cols-3 px-4">
        <app-clip-placeholder></app-clip-placeholder>
        <app-clip-placeholder></app-clip-placeholder>
        <app-clip-placeholder></app-clip-placeholder>
      </div>
    }
  </div>
</section>

<app-edit
  [activeClip]="activeClip()"
  (updatedClipData)="updateClip($event)"
  (deletedClipData)="deleteClip($event)"
></app-edit>
