<!-- Tabs -->
<nav
  class="flex flex-nowrap mb-4 text-center border border-indigo-400 rounded-full tab-slider"
  [class.left]="tabs()[0].tabStatus()"
  [class.right]="tabs()[1].tabStatus()"
>
  @for (tab of tabs(); track $index) {
    <a
      class="block w-full rounded-full py-3 px-4 transition text-white"
      [class]="{
        'hover:text-indigo-400': !tab.tabStatus(),
      }"
      href=""
      (click)="selectTab(tab)"
      >{{ tab.tabTitle() }}</a
    >
  }
</nav>

<ng-content></ng-content>
