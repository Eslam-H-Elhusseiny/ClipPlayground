<!-- Tabs -->
<nav class="flex flex-nowrap mb-4 text-center">
  @for(tab of tabs();track $index) {

  <a
    class="block w-full rounded py-3 px-4 transition hover:text-white text-white"
    [class]="{
      'hover:text-indigo-400': !tab.tabStatus(),
      'hover:text-white': tab.tabStatus(),
      'bg-indigo-400': tab.tabStatus(),
    }"
    href=""
    (click)="selectTab(tab)"
    >{{ tab.tabTitle() }}</a
  >
  }
</nav>

<ng-content></ng-content>
